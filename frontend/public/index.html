<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneio de Sueca · S. Cibrão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="/vendor/qrcode.min.js"></script>
<script src="/tournament.js?v=20"></script>
<script type="text/babel" src="/cards.jsx?v=20"></script>
<script type="text/babel" src="/setup-admin.jsx?v=20"></script>
<script type="text/babel" src="/views.jsx?v=20"></script>

<script type="text/babel">
// Cache-bust version for frontend deploys.
// Bump this value whenever JS/CSS/HTML changes need to be forced onto clients.
// Keep the `?v=` asset query params below in sync with this version.
// After bumping it, redeploy/restart the frontend so clients receive the new version.
const APP_VERSION = "20";
const APP_VERSION_KEY = "sueca_app_version";
const RELOAD_GUARD_KEY = "sueca_app_version_reload";

try {
  const seenVersion = localStorage.getItem(APP_VERSION_KEY);
  const reloadGuard = sessionStorage.getItem(RELOAD_GUARD_KEY);
  if (seenVersion !== APP_VERSION && reloadGuard !== APP_VERSION) {
    localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
    sessionStorage.setItem(RELOAD_GUARD_KEY, APP_VERSION);
    const nextUrl = new URL(window.location.href);
    nextUrl.searchParams.set("_v", APP_VERSION);
    window.location.replace(nextUrl.toString());
  } else if (reloadGuard === APP_VERSION) {
    sessionStorage.removeItem(RELOAD_GUARD_KEY);
  }
} catch (e) {}

const { useState, useEffect, useRef } = React;

// ---- View rotation config ----
const DEFAULT_ROTATION = 24000; // ms per view (overridable via state.setup.slideSeconds)
function rotationMs(state) {
  const s = state?.setup?.slideSeconds;
  return (s && s > 0) ? s * 1000 : DEFAULT_ROTATION;
}

// ---- Projector (big screen, polls by code, obeys admin remote) ----
function ProjectorApp({ code }) {
  const [state, setState] = useState(null);
  const [err, setErr] = useState(null);
  const [viewIdx, setViewIdx] = useState(0);
  const [localPaused, setLocalPaused] = useState(false);
  const [nowTick, setNowTick] = useState(Date.now());
  const [dealing, setDealing] = useState(false);
  const [burstTrigger, setBurstTrigger] = useState(0);
  const [lastWinnerId, setLastWinnerId] = useState(null);
  const lastSeenSeq = useRef(0);

  useEffect(() => {
    let cancelled = false;
    async function poll() {
      try {
        const s = await window.SuecaEngine.loadByTournamentCode(code);
        if (!cancelled) { setState(s); setErr(null); }
      } catch (e) {
        if (!cancelled) setErr(e.message || String(e));
      }
    }
    poll();
    const t = setInterval(poll, 1000);
    return () => { cancelled = true; clearInterval(t); };
  }, [code]);

  useEffect(() => {
    const t = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const views = React.useMemo(() => {
    if (!state) return [];
    const list = [];
    const hasActive = state.matches.some(m => m.status === "pending" || m.status === "live");
    const allDone = state.matches.length > 0 && !hasActive;
    if (allDone) list.push({ key: "finale", label: "Campeões", render: () => <FinaleView state={state}/> });
    else list.push({ key: "now", label: "Em Jogo", render: () => <ViewNowPlaying state={state}/> });
    if (state.format === "knockout" || state.format === "groups") {
      list.push({ key: "bracket", label: state.format==="groups"?"Grupos":"Bracket", render: () => <ViewBracket state={state}/> });
    } else if (state.format === "league") {
      list.push({ key: "schedule", label: "Jornadas", render: () => <ViewSchedule state={state}/> });
    }
    list.push({ key: "rank", label: "Ranking", render: () => <ViewRanking state={state}/> });
    list.push({ key: "upc", label: "Próx/Hist", render: () => <ViewUpcomingHistory state={state}/> });
    if (state.code) list.push({ key: "qr", label: "QR", render: () => <ViewQR state={state}/> });
    if (state.setup.sponsors && state.setup.sponsors.length > 0) {
      list.push({ key: "sponsors", label: "Patrocinadores", render: () => <ViewSponsors state={state}/> });
    }
    return list;
  }, [state]);

  useEffect(() => {
    if (!state || !state.remote) return;
    const seq = state.remote.seq || 0;
    if (seq > lastSeenSeq.current) {
      lastSeenSeq.current = seq;
      if (state.remote.viewKey) {
        const idx = views.findIndex(v => v.key === state.remote.viewKey);
        if (idx >= 0) setViewIdx(idx);
      }
      setLocalPaused(!!state.remote.paused);
    }
  }, [state, views]);

  useEffect(() => {
    if (!state?.history?.length) return;
    const latest = state.history[0];
    if (latest && latest.id !== lastWinnerId) {
      setLastWinnerId(latest.id);
      setBurstTrigger(b => b + 1);
    }
  }, [state?.history]);

  const paused = localPaused;

  useEffect(() => {
    if (paused || views.length <= 1) return;
    const t = setInterval(() => {
      setDealing(true);
      setTimeout(() => {
        setViewIdx(i => (i + 1) % views.length);
        setTimeout(() => setDealing(false), 400);
      }, 400);
    }, rotationMs(state));
    return () => clearInterval(t);
  }, [paused, views.length, state]);

  useEffect(() => { if (viewIdx >= views.length) setViewIdx(0); }, [views.length]);

  useEffect(() => {
    function onKey(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === " ") { e.preventDefault(); setLocalPaused(p => !p); }
      if (e.key === "ArrowRight") setViewIdx(i => (i + 1) % views.length);
      if (e.key === "ArrowLeft") setViewIdx(i => (i - 1 + views.length) % views.length);
      if (e.key === "f" || e.key === "F") {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [views.length]);

  if (!state) {
    return (
      <div className="spectator-loading">
        <div className="empty-big">
          {err ? <><p>Não foi possível ligar ao torneio.</p><small style={{opacity:0.6}}>{err}</small></> : <p>A carregar torneio…</p>}
        </div>
      </div>
    );
  }

  const currentView = views[viewIdx] || views[0];
  return (
    <>
      <AmbientCards count={5} />
      <ProjectorFrame state={state} viewIdx={viewIdx} viewCount={views.length} viewLabel={currentView?.label}>
        {currentView && currentView.render()}
      </ProjectorFrame>
      <CardBurst trigger={burstTrigger} />
      <DealingCards playing={dealing} />
      {paused && <div className="pause-indicator">⏸ Rotação pausada · Espaço para retomar</div>}
      <div className="kbd-hints">
        <span>Espaço <em>pausa</em></span>
        <span>← → <em>mudar vista</em></span>
        <span>F <em>ecrã cheio</em></span>
      </div>
      <MadeByFooter />
    </>
  );
}

// ---- Spectator (phone, tabs, read-only) ----
function SpectatorApp({ code }) {
  const [state, setState] = useState(null);
  const [err, setErr] = useState(null);
  const [viewIdx, setViewIdx] = useState(0);
  const [nowTick, setNowTick] = useState(Date.now());
  const [autoRotate, setAutoRotate] = useState(() => {
    try {
      return !window.matchMedia("(pointer: coarse)").matches;
    } catch (e) {
      return true;
    }
  });

  useEffect(() => {
    let cancelled = false;
    async function poll() {
      try {
        const s = await window.SuecaEngine.loadByTournamentCode(code);
        if (!cancelled) { setState(s); setErr(null); }
      } catch (e) {
        if (!cancelled) setErr(e.message || String(e));
      }
    }
    poll();
    const t = setInterval(poll, 5000);
    return () => { cancelled = true; clearInterval(t); };
  }, [code]);

  useEffect(() => {
    const t = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const views = React.useMemo(() => {
    if (!state) return [];
    const list = [];
    const hasActive = state.matches.some(m => m.status === "pending" || m.status === "live");
    const allDone = state.matches.length > 0 && !hasActive;
    if (allDone) {
      list.push({ key: "finale", label: "Campeões", render: () => <FinaleView state={state}/> });
    } else {
      list.push({ key: "now", label: "Em Jogo", render: () => <ViewNowPlaying state={state}/> });
    }
    if (state.format === "knockout" || state.format === "groups") {
      list.push({ key: "bracket", label: state.format==="groups"?"Grupos":"Bracket", render: () => <ViewBracket state={state}/> });
    } else if (state.format === "league") {
      list.push({ key: "schedule", label: "Jornadas", render: () => <ViewSchedule state={state}/> });
    }
    list.push({ key: "rank", label: "Ranking", render: () => <ViewRanking state={state}/> });
    list.push({ key: "upc", label: "Próx/Hist", render: () => <ViewUpcomingHistory state={state}/> });
    if (state.setup.sponsors && state.setup.sponsors.length > 0) {
      list.push({ key: "sponsors", label: "Patrocinadores", render: () => <ViewSponsors state={state}/> });
    }
    return list;
  }, [state]);

  useEffect(() => {
    if (!autoRotate || views.length <= 1) return;
    const t = setInterval(() => setViewIdx(i => (i + 1) % views.length), rotationMs(state));
    return () => clearInterval(t);
  }, [autoRotate, views.length, state]);

  useEffect(() => { if (viewIdx >= views.length) setViewIdx(0); }, [views.length]);

  function selectView(idx) {
    setViewIdx(idx);
    setAutoRotate(false);
  }

  if (!state) {
    return (
      <div className="spectator-loading">
        <div className="empty-big">
          {err ? <><p>Não foi possível ligar ao torneio.</p><small style={{opacity:0.6}}>{err}</small></> : <p>A carregar torneio…</p>}
        </div>
      </div>
    );
  }

  const currentView = views[viewIdx] || views[0];
  return (
    <>
      <AmbientCards count={5} />
      <ProjectorFrame state={state} viewIdx={viewIdx} viewCount={views.length} viewLabel={currentView?.label}>
        {currentView && currentView.render()}
      </ProjectorFrame>
      <div className="spectator-badge">VISTA DO ESPECTADOR</div>
      {views.length > 1 && (
        <div className="spectator-controls">
          <div className="spectator-controls-head">
            <div className="spectator-controls-title">Escolher vista</div>
            <button
              className={`spectator-rotate-toggle ${autoRotate ? "on" : ""}`}
              onClick={() => setAutoRotate(v => !v)}
              type="button"
            >
              {autoRotate ? "Auto" : "Manual"}
            </button>
          </div>
          <div className="spectator-tabs" role="tablist" aria-label="Vistas do espectador">
            {views.map((view, idx) => (
              <button
                key={view.key}
                type="button"
                role="tab"
                aria-selected={idx === viewIdx}
                className={`spectator-tab ${idx === viewIdx ? "on" : ""}`}
                onClick={() => selectView(idx)}
              >
                {view.label}
              </button>
            ))}
          </div>
        </div>
      )}
      <MadeByFooter />
    </>
  );
}

// ---- Landing / code-lookup wrappers ----
function LandingApp() {
  const [view, setView] = useState("landing"); // landing | setup | codes
  const [setupState, setSetupState] = useState(() => {
    const s = window.SuecaEngine.loadState();
    s.tournamentId = null;
    s.matches = []; s.rounds = []; s.history = [];
    s.code = undefined; s.adminCode = undefined;
    return s;
  });
  const [codes, setCodes] = useState(null);

  if (view === "setup") {
    return (
      <>
        <AmbientCards count={8} />
        <SetupScreen
          state={setupState}
          setState={setSetupState}
          onCreated={(c) => { setCodes(c); setView("codes"); }}
        />
        <MadeByFooter />
      </>
    );
  }
  if (view === "codes" && codes) {
    return (
      <>
        <AmbientCards count={5} />
        <CodesScreen
          code={codes.code}
          adminCode={codes.adminCode}
          tournamentName={codes.tournamentName}
        />
        <MadeByFooter />
      </>
    );
  }
  return (
    <>
      <AmbientCards count={8} />
      <LandingScreen onStart={() => setView("setup")} />
      <MadeByFooter />
    </>
  );
}

// ---- Admin page: full-screen control panel (no projector views) ----
function AdminPageApp({ code }) {
  const [state, setState] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    let cancelled = false;
    window.SuecaEngine.loadByAdminCode(code).then(
      s => { if (!cancelled) setState(s); },
      e => { if (!cancelled) setErr(e?.message || "Torneio não encontrado."); }
    );
    return () => { cancelled = true; };
  }, [code]);

  if (err) {
    return (
      <div className="spectator-loading">
        <div className="empty-big">
          <p>Torneio não encontrado.</p>
          <small style={{opacity:0.6}}>Código admin: {code}</small>
          <p style={{marginTop:20}}>
            <a href="/" className="primary" style={{textDecoration:"none", padding:"10px 18px", borderRadius:8}}>
              ← Voltar
            </a>
          </p>
        </div>
      </div>
    );
  }
  if (!state) {
    return (
      <div className="spectator-loading">
        <div className="empty-big"><p>A carregar painel…</p></div>
      </div>
    );
  }
  return <AdminHost initialState={state} />;
}

function AdminHost({ initialState }) {
  const [state, setState] = useState(initialState);
  useEffect(() => { window.SuecaEngine.saveState(state); }, [state]);
  return (
    <>
      <AdminPanel state={state} setState={setState} fullPage={true} open={true} setOpen={()=>{}} />
      <MadeByFooter />
    </>
  );
}

// ---- Router: landing / projector / spectator / admin ----
const _root = ReactDOM.createRoot(document.getElementById("root"));
const _tMatch = window.location.pathname.match(/^\/t\/([A-Za-z]{4})\/?$/);
const _sMatch = window.location.pathname.match(/^\/s\/([A-Za-z]{4})\/?$/);
const _aMatch = window.location.pathname.match(/^\/a\/([A-Za-z]{6})\/?$/);
if (_tMatch) {
  _root.render(<ProjectorApp code={_tMatch[1].toUpperCase()} />);
} else if (_sMatch) {
  _root.render(<SpectatorApp code={_sMatch[1].toUpperCase()} />);
} else if (_aMatch) {
  _root.render(<AdminPageApp code={_aMatch[1].toUpperCase()} />);
} else {
  _root.render(<LandingApp />);
}
</script>

</style>
</body>
